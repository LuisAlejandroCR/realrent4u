# ci.yml: runs the test suite, the submission validator and the offline pipeline check (A2: committed
# outputs reproduce from runs/raw/ and derived/census/) on every PR and push to main. No network or API key.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python -m realrent.validate
      - run: uv run python -m realrent.pipeline --check
